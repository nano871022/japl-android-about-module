name: Reusable Lint Check

on:
  workflow_call:
    outputs:
      lint_outcome:
        description: "Outcome of the lint step (success or failure)"
        value: ${{ jobs.lint.outputs.lint_outcome }}
      lint_report_path:
        description: "Path to lint results/reports if failed"
        value: ${{ jobs.lint.outputs.lint_report_path }}

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      lint_outcome: ${{ steps.run-lint.outcome }}
      lint_report_path: "build/reports/lint-results-debug.xml"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37'

      - name: Run Android Lint
        id: run-lint
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew lintDebug --continue 2>&1 | tee build/lint-execution.log
          else
            gradle lintDebug --continue 2>&1 | tee build/lint-execution.log
          fi

      - name: Upload Lint Reports Artifact
        if: steps.run-lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            build/lint-execution.log
            build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail job if lint failed
        if: steps.run-lint.outcome == 'failure'
        run: exit 1
